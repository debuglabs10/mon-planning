<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mon planning</title>
<style>
:root{--ink:#1d2b64;--ok:#2fc46b;--bg:#fffdf6}
*{box-sizing:border-box;margin:0}
body{font-family:"Fredoka","Baloo 2","Trebuchet MS","Comic Sans MS",system-ui,sans-serif;color:var(--ink);background:var(--bg);min-height:100vh;padding:20px 16px 48px;
background-image:radial-gradient(circle at 8% 4%,#fff0a6 0 90px,transparent 91px),radial-gradient(circle at 95% 3%,#ddd6ff 0 90px,transparent 91px)}
header{text-align:center;margin:8px auto 24px}
.title{display:inline-block;background:#f6c98a;border:4px solid #e0a050;border-radius:22px 22px 40px 40px;padding:8px 36px;font-size:clamp(2rem,7vw,3.2rem);font-weight:700;box-shadow:0 6px 0 #d58f3d}
.date{margin-top:14px;font-size:1.1rem;opacity:.75}
.deco{display:inline-block;font-size:clamp(2rem,7vw,3rem);animation:float 3s ease-in-out infinite}
.deco.m{animation-delay:1.5s}
main{max-width:1000px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:28px}
@media(max-width:760px){main{grid-template-columns:1fr}}
.panel{border-radius:32px;padding:20px 18px 24px;border:4px solid}
.panel.matin{background:#fff6cf;border-color:#f5b81c}
.panel.soir{background:#ece8ff;border-color:#8b7bf0}
.panel h2{font-size:2.2rem;text-align:center;margin-bottom:10px}
.bar{height:18px;border-radius:99px;background:#fff;border:3px solid;overflow:hidden;margin:0 auto 6px}
.matin .bar{border-color:#f5b81c}.soir .bar{border-color:#8b7bf0}
.fill{height:100%;width:0;border-radius:99px;transition:width .5s cubic-bezier(.3,1.4,.5,1)}
.matin .fill{background:linear-gradient(90deg,#ffb703,#ff7a00)}
.soir .fill{background:linear-gradient(90deg,#8b7bf0,#e06bd0)}
.count{text-align:center;font-size:1rem;margin-bottom:14px;opacity:.8}
ul{list-style:none;padding:0;display:grid;gap:12px}
.step{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:14px;width:100%;background:#fff;border-radius:22px;padding:12px 16px;font-size:1.25rem;font-weight:600;line-height:1.2;box-shadow:0 4px 0 rgba(29,43,100,.12);transition:transform .15s,background .3s;-webkit-tap-highlight-color:transparent;position:relative}
.step:hover{transform:translateY(-2px)}
.step:active{transform:scale(.97)}
.step:focus-visible{outline:4px solid #1d2b64;outline-offset:3px}
.box{flex:none;width:44px;height:44px;border-radius:14px;border:4px solid var(--ink);display:grid;place-items:center;font-size:1.7rem;color:#fff;transition:background .2s,border-color .2s}
.ico{flex:none;font-size:2.4rem;width:52px;text-align:center}
.step[aria-pressed=true]{background:#e8fbee}
.step[aria-pressed=true] .box{background:var(--ok);border-color:var(--ok);animation:pop .5s}
.step[aria-pressed=true] .box::after{content:"✓";font-weight:700}
.step[aria-pressed=true] .ico{animation:wiggle .6s}
.step[aria-pressed=true] .txt{text-decoration:line-through;text-decoration-thickness:3px;text-decoration-color:var(--ok)}
.done-msg{text-align:center;font-size:1.4rem;font-weight:700;margin-top:16px;min-height:2em;opacity:0;transform:scale(.5);transition:.4s cubic-bezier(.3,1.6,.5,1)}
.done-msg.on{opacity:1;transform:scale(1)}
footer{text-align:center;margin-top:30px}
.reset{font:inherit;font-size:1.05rem;font-weight:600;color:var(--ink);background:#fff;border:3px solid var(--ink);border-radius:99px;padding:10px 24px;cursor:pointer}
.reset:focus-visible{outline:4px solid #8b7bf0;outline-offset:3px}
.spark{position:fixed;pointer-events:none;font-size:1.4rem;z-index:50}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:60;width:100%;height:100%}
.win{position:fixed;inset:0;z-index:70;display:none;place-items:center;background:rgba(29,43,100,.55);padding:20px}
.win.on{display:grid}
.card{background:#fffdf6;border:6px solid #ffd23f;border-radius:36px;padding:28px 24px;max-width:420px;text-align:center;animation:zoom .7s cubic-bezier(.3,1.6,.5,1);position:relative;overflow:hidden}
.trophy{font-size:7rem;line-height:1;display:inline-block;animation:bounce 1s ease-in-out infinite}
.card h3{font-size:2.4rem;margin:8px 0}
.card p{font-size:1.25rem;margin-bottom:18px}
.stars{font-size:2rem;letter-spacing:6px;animation:twinkle 1.2s infinite}
.card .reset{background:#ffd23f;border-color:#f5b81c}
@keyframes pop{0%{transform:scale(.4)}60%{transform:scale(1.4)}100%{transform:scale(1)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-18deg) scale(1.2)}75%{transform:rotate(18deg) scale(1.2)}}
@keyframes float{50%{transform:translateY(-8px) rotate(6deg)}}
@keyframes zoom{from{transform:scale(.2) rotate(-8deg);opacity:0}}
@keyframes bounce{50%{transform:translateY(-16px) scale(1.08)}}
@keyframes twinkle{50%{opacity:.4;transform:scale(1.1)}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<header>
  <span class="deco" aria-hidden="true">☀️</span>
  <h1 class="title">Mon planning</h1>
  <span class="deco m" aria-hidden="true">🌙</span>
  <p class="date" id="date"></p>
</header>

<main id="app"></main>

<footer><button class="reset" id="reset">🔄 Recommencer</button></footer>

<canvas id="confetti" aria-hidden="true"></canvas>
<div class="win" id="win" role="dialog" aria-modal="true" aria-label="Bravo">
  <div class="card">
    <div class="stars" aria-hidden="true">⭐⭐⭐</div>
    <div class="trophy" aria-hidden="true">🏆</div>
    <h3>Bravo champion !</h3>
    <p id="wp">Tu as tout terminé aujourd’hui. Tu peux être très fier de toi !</p>
    <button class="reset" id="close">🎉 Merci !</button>
  </div>
</div>

<script>
// ✏️ Pour modifier le planning, change simplement les lignes ci-dessous : [icône, texte]
const SECTIONS = [
  { id: "matin", titre: "Matin", emoji: "☀️", fin: "Matin terminé ! 🌟", etapes: [
    ["💧","Faire les ablutions"],["🤲","Faire la prière"],["🥣","Prendre le petit-déjeuner"],["🚽","Aller aux toilettes si besoin"],
    ["🧼","Se laver les mains"],["💦","Se laver le visage"],["🪥","Se brosser les dents"],["👕","S’habiller"] ] },
  { id: "soir", titre: "Soir", emoji: "🌙", fin: "Soirée terminée ! 🌟", etapes: [
    ["🧸","Ranger les affaires"],["🍎","Prendre le goûter"],["🚿","Prendre la douche"],["📚","Faire les devoirs"],
    ["🍽️","Prendre le repas"],["🪥","Se brosser les dents"],["📖","Lire un livre"],["😴","Dormir"] ] }
];

const today = new Date().toISOString().slice(0, 10);
const KEY = "planning-enfant";
let state = {};
try {
  const saved = JSON.parse(localStorage.getItem(KEY) || "{}");
  if (saved.jour === today) state = saved.etat || {};
} catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify({ jour: today, etat: state })); } catch (e) {} };

document.getElementById("date").textContent =
  new Date().toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" });

const app = document.getElementById("app");
SECTIONS.forEach(s => {
  const p = document.createElement("section");
  p.className = "panel " + s.id;
  p.innerHTML = `<h2>${s.emoji} ${s.titre}</h2>
    <div class="bar" role="progressbar" aria-label="Progression ${s.titre}"><div class="fill"></div></div>
    <div class="count"></div><ul></ul><div class="done-msg">${s.fin}</div>`;
  const ul = p.querySelector("ul");
  s.etapes.forEach(([ico, txt], i) => {
    const k = s.id + i;
    const li = document.createElement("li");
    li.innerHTML = `<button class="step" aria-pressed="${!!state[k]}"><span class="box"></span><span class="ico" aria-hidden="true">${ico}</span><span class="txt">${txt}</span></button>`;
    li.firstChild.addEventListener("click", e => {
      state[k] = !state[k];
      li.firstChild.setAttribute("aria-pressed", state[k]);
      save();
      if (state[k]) { burst(li.querySelector(".box")); sfx("check"); }
      update(s, p, state[k]);
    });
    ul.appendChild(li);
  });
  app.appendChild(p);
  update(s, p, false, true);
});

function update(s, p, fromClick, silent) {
  const n = s.etapes.filter((_, i) => state[s.id + i]).length;
  const total = s.etapes.length;
  p.querySelector(".fill").style.width = (n / total * 100) + "%";
  p.querySelector(".bar").setAttribute("aria-valuenow", Math.round(n / total * 100));
  p.querySelector(".count").textContent = n + " / " + total + (n === total ? " 🎉" : "");
  const was = p.querySelector(".done-msg").classList.contains("on");
  p.querySelector(".done-msg").classList.toggle("on", n === total);
  if (silent) return;
  if (n === total && !was && fromClick) {
    const all = SECTIONS.every(x => x.etapes.every((_, i) => state[x.id + i]));
    setTimeout(() => sfx("win"), 350);
    setTimeout(() => win(s, all), 450);
  }
}

/* 🔊 Sons (générés par le navigateur, aucun fichier à ajouter) */
let ac;
function note(f, t, d, v) {
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = "triangle"; o.frequency.value = f;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(v, t + .02);
  g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g); g.connect(ac.destination);
  o.start(t); o.stop(t + d + .05);
}
function sfx(kind) {
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === "suspended") ac.resume();
    const t = ac.currentTime;
    if (kind === "check") {
      note(660, t, .15, .25); note(990, t + .09, .3, .25);
    } else {
      [523, 659, 784, 1047, 1319].forEach((f, i) => note(f, t + i * .12, .4, .28));
      note(1568, t + .65, 1, .25); note(1047, t + .65, 1, .2);
    }
  } catch (e) {}
}

/* ✨ Petites étoiles à chaque case cochée */
function burst(el) {
  const r = el.getBoundingClientRect();
  const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  const items = ["⭐", "✨", "🌟", "💛"];
  for (let i = 0; i < 10; i++) {
    const s = document.createElement("span");
    s.className = "spark";
    s.textContent = items[i % items.length];
    s.style.left = cx + "px"; s.style.top = cy + "px";
    document.body.appendChild(s);
    const a = Math.PI * 2 * i / 10, d = 50 + Math.random() * 40;
    s.animate([
      { transform: "translate(-50%,-50%) scale(.3)", opacity: 1 },
      { transform: `translate(calc(-50% + ${Math.cos(a) * d}px),calc(-50% + ${Math.sin(a) * d}px)) scale(1.3)`, opacity: 0 }
    ], { duration: 700, easing: "ease-out" }).onfinish = () => s.remove();
  }
}

/* 🎊 Confettis */
const cv = document.getElementById("confetti"), ctx = cv.getContext("2d");
let parts = [], raf = 0, endAt = 0;
function size() { cv.width = innerWidth; cv.height = innerHeight; }
addEventListener("resize", size); size();
const COLORS = ["#ffd23f", "#ff6b6b", "#4dabf7", "#8b7bf0", "#2fc46b", "#ff9f1c", "#f783ac"];
function confetti(n, x, y, ms) {
  for (let i = 0; i < n; i++) {
    parts.push({ x, y, vx: (Math.random() - .5) * 16, vy: -Math.random() * 14 - 4, g: .3, w: 8 + Math.random() * 8,
      h: 5 + Math.random() * 8, r: Math.random() * 6, vr: (Math.random() - .5) * .4, c: COLORS[i % COLORS.length] });
  }
  endAt = Math.max(endAt, performance.now() + ms);
  if (!raf) raf = requestAnimationFrame(tick);
}
function tick(t) {
  ctx.clearRect(0, 0, cv.width, cv.height);
  parts.forEach(p => {
    p.vy += p.g; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.vx *= .99;
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c;
    ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore();
  });
  parts = parts.filter(p => p.y < cv.height + 40);
  if (parts.length && t < endAt + 3000) raf = requestAnimationFrame(tick);
  else { raf = 0; ctx.clearRect(0, 0, cv.width, cv.height); }
}

/* 🏆 Grande récompense */
const winEl = document.getElementById("win");
function win(s, all) {
  document.getElementById("wp").textContent = all
    ? "Tu as tout terminé aujourd’hui. Tu peux être très fier de toi !"
    : s.id === "matin"
      ? "Tu as terminé tout ton matin. Super travail !"
      : "Tu as terminé toute ta soirée. Super travail !";
  winEl.classList.add("on");
  document.getElementById("close").focus();
  let k = 0;
  const go = () => {
    confetti(70, Math.random() * innerWidth, innerHeight * .9, 400);
    confetti(40, innerWidth * (k % 2 ? .15 : .85), innerHeight * .8, 400);
    if (++k < 8 && winEl.classList.contains("on")) setTimeout(go, 450);
  };
  go();
}
document.getElementById("close").onclick = () => winEl.classList.remove("on");
document.getElementById("reset").onclick = () => { state = {}; save(); location.reload(); };
</script>
</body>
</html>
